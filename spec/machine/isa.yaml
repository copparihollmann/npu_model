# isa.yaml — `op` nodes. SSA-critical families (LSU/VPU/MXU/DMA) carry typed
# operands (direction def/use) + a structured `effect` (small AST) -> mechanical
# def-use. Scalar/control ops keep prose `sem`. Encodings: field VALUES are
# authoritative; bit placement is recommended (see human/SPEC.md §6). DMA is
# channelized (funct3 = channel) and represented once per logical op.
nodes:

# ============================ scalar integer (prose) ========================
- {id: op.add,  kind: op, status: normative, attrs: {family: scalar_alu, exu: SCALAR, encoding: {format: R, opcode: 0b0110011, funct3: 0b000, funct7: 0b0000000}, sem: "rd = rs1 + rs2"}, refs: {latency_class: timing.scalar_alu}}
- {id: op.sub,  kind: op, status: normative, attrs: {family: scalar_alu, exu: SCALAR, encoding: {format: R, opcode: 0b0110011, funct3: 0b000, funct7: 0b0100000}, sem: "rd = rs1 - rs2"}, refs: {latency_class: timing.scalar_alu}}
- {id: op.sll,  kind: op, status: normative, attrs: {family: scalar_alu, exu: SCALAR, encoding: {format: R, opcode: 0b0110011, funct3: 0b001, funct7: 0b0000000}, sem: "rd = rs1 << rs2"}, refs: {latency_class: timing.scalar_alu}}
- {id: op.slt,  kind: op, status: normative, attrs: {family: scalar_alu, exu: SCALAR, encoding: {format: R, opcode: 0b0110011, funct3: 0b010, funct7: 0b0000000}, sem: "rd = (rs1 < rs2) signed"}, refs: {latency_class: timing.scalar_alu}}
- {id: op.sltu, kind: op, status: normative, attrs: {family: scalar_alu, exu: SCALAR, encoding: {format: R, opcode: 0b0110011, funct3: 0b011, funct7: 0b0000000}, sem: "rd = (rs1 < rs2) unsigned"}, refs: {latency_class: timing.scalar_alu}}
- {id: op.xor,  kind: op, status: normative, attrs: {family: scalar_alu, exu: SCALAR, encoding: {format: R, opcode: 0b0110011, funct3: 0b100, funct7: 0b0000000}, sem: "rd = rs1 ^ rs2"}, refs: {latency_class: timing.scalar_alu}}
- {id: op.srl,  kind: op, status: normative, attrs: {family: scalar_alu, exu: SCALAR, encoding: {format: R, opcode: 0b0110011, funct3: 0b101, funct7: 0b0000000}, sem: "rd = rs1 >> rs2 (logical)"}, refs: {latency_class: timing.scalar_alu}}
- {id: op.sra,  kind: op, status: normative, attrs: {family: scalar_alu, exu: SCALAR, encoding: {format: R, opcode: 0b0110011, funct3: 0b101, funct7: 0b0100000}, sem: "rd = rs1 >> rs2 (arith)"}, refs: {latency_class: timing.scalar_alu}}
- {id: op.or,   kind: op, status: normative, attrs: {family: scalar_alu, exu: SCALAR, encoding: {format: R, opcode: 0b0110011, funct3: 0b110, funct7: 0b0000000}, sem: "rd = rs1 | rs2"}, refs: {latency_class: timing.scalar_alu}}
- {id: op.and,  kind: op, status: normative, attrs: {family: scalar_alu, exu: SCALAR, encoding: {format: R, opcode: 0b0110011, funct3: 0b111, funct7: 0b0000000}, sem: "rd = rs1 & rs2"}, refs: {latency_class: timing.scalar_alu}}
- {id: op.addi,  kind: op, status: normative, attrs: {family: scalar_imm, exu: SCALAR, encoding: {format: I, opcode: 0b0010011, funct3: 0b000}, sem: "rd = rs1 + sext(imm12)"}, refs: {latency_class: timing.scalar_alu}}
- {id: op.slti,  kind: op, status: normative, attrs: {family: scalar_imm, exu: SCALAR, encoding: {format: I, opcode: 0b0010011, funct3: 0b010}, sem: "rd = (rs1 < sext(imm12)) signed"}, refs: {latency_class: timing.scalar_alu}}
- {id: op.sltiu, kind: op, status: normative, attrs: {family: scalar_imm, exu: SCALAR, encoding: {format: I, opcode: 0b0010011, funct3: 0b011}, sem: "rd = (rs1 < sext(imm12)) unsigned"}, refs: {latency_class: timing.scalar_alu}}
- {id: op.xori,  kind: op, status: normative, attrs: {family: scalar_imm, exu: SCALAR, encoding: {format: I, opcode: 0b0010011, funct3: 0b100}, sem: "rd = rs1 ^ sext(imm12)"}, refs: {latency_class: timing.scalar_alu}}
- {id: op.ori,   kind: op, status: normative, attrs: {family: scalar_imm, exu: SCALAR, encoding: {format: I, opcode: 0b0010011, funct3: 0b110}, sem: "rd = rs1 | sext(imm12)"}, refs: {latency_class: timing.scalar_alu}}
- {id: op.andi,  kind: op, status: normative, attrs: {family: scalar_imm, exu: SCALAR, encoding: {format: I, opcode: 0b0010011, funct3: 0b111}, sem: "rd = rs1 & sext(imm12)"}, refs: {latency_class: timing.scalar_alu}}
- {id: op.slli,  kind: op, status: normative, attrs: {family: scalar_imm, exu: SCALAR, encoding: {format: I, opcode: 0b0010011, funct3: 0b001}, sem: "rd = rs1 << shamt", notes: "shamt model &0x3F"}, refs: {latency_class: timing.scalar_alu}}
- {id: op.srli,  kind: op, status: normative, attrs: {family: scalar_imm, exu: SCALAR, encoding: {format: I, opcode: 0b0010011, funct3: 0b101}, sem: "rd = rs1 >> shamt (logical)"}, refs: {latency_class: timing.scalar_alu}}
- {id: op.srai,  kind: op, status: normative, attrs: {family: scalar_imm, exu: SCALAR, encoding: {format: I, opcode: 0b0010011, funct3: 0b101, upper_imm: 0b0100000}, sem: "rd = rs1 >> shamt (arith)"}, refs: {latency_class: timing.scalar_alu}}
- {id: op.lui,   kind: op, status: normative, attrs: {family: scalar_upper_imm, exu: SCALAR, encoding: {format: U, opcode: 0b0110111}, sem: "rd = imm20 << 12"}, refs: {latency_class: timing.scalar_alu}}
- {id: op.auipc, kind: op, status: normative, attrs: {family: scalar_upper_imm, exu: SCALAR, encoding: {format: U, opcode: 0b0010111}, sem: "rd = (imm20<<12) + address_of_auipc"}, refs: {latency_class: timing.scalar_alu}}

# ============================ control flow (prose) ==========================
- {id: op.beq,  kind: op, status: normative, attrs: {family: branch, exu: SCALAR, encoding: {format: SB, opcode: 0b1100011, funct3: 0b000}, sem: "if rs1==rs2: pc += sext(imm13)", delay_slots: 2}, refs: {latency_class: timing.scalar_alu}}
- {id: op.bne,  kind: op, status: normative, attrs: {family: branch, exu: SCALAR, encoding: {format: SB, opcode: 0b1100011, funct3: 0b001}, sem: "if rs1!=rs2: pc += sext(imm13)", delay_slots: 2}, refs: {latency_class: timing.scalar_alu}}
- {id: op.blt,  kind: op, status: normative, attrs: {family: branch, exu: SCALAR, encoding: {format: SB, opcode: 0b1100011, funct3: 0b100}, sem: "if rs1<rs2 (signed): pc += sext(imm13)", delay_slots: 2}, refs: {latency_class: timing.scalar_alu}}
- {id: op.bge,  kind: op, status: normative, attrs: {family: branch, exu: SCALAR, encoding: {format: SB, opcode: 0b1100011, funct3: 0b101}, sem: "if rs1>=rs2 (signed): pc += sext(imm13)", delay_slots: 2}, refs: {latency_class: timing.scalar_alu}}
- {id: op.bltu, kind: op, status: normative, attrs: {family: branch, exu: SCALAR, encoding: {format: SB, opcode: 0b1100011, funct3: 0b110}, sem: "if rs1<rs2 (unsigned): pc += sext(imm13)", delay_slots: 2}, refs: {latency_class: timing.scalar_alu}}
- {id: op.bgeu, kind: op, status: normative, attrs: {family: branch, exu: SCALAR, encoding: {format: SB, opcode: 0b1100011, funct3: 0b111}, sem: "if rs1>=rs2 (unsigned): pc += sext(imm13)", delay_slots: 2}, refs: {latency_class: timing.scalar_alu}}
- {id: op.jal,  kind: op, status: normative, attrs: {family: jump, exu: SCALAR, encoding: {format: UJ, opcode: 0b1101111}, sem: "rd = pc+4; pc += sext(imm21)", delay_slots: 2}, refs: {latency_class: timing.scalar_alu}}
- {id: op.jalr, kind: op, status: normative, attrs: {family: jump, exu: SCALAR, encoding: {format: I, opcode: 0b1100111, funct3: 0b000}, sem: "rd = pc+4; pc = rs1 + sext(imm)", delay_slots: 2}, refs: {latency_class: timing.scalar_alu}}

# ============================ csr / control misc (prose) ====================
- {id: op.csrrw,  kind: op, status: reference, attrs: {family: csr, exu: SCALAR, encoding: {format: CSR, opcode: 0b1110011, funct3: 0b001}, sem: "rd = csr; csr = rs1"}, refs: {latency_class: timing.scalar_alu}}
- {id: op.csrrs,  kind: op, status: reference, attrs: {family: csr, exu: SCALAR, encoding: {format: CSR, opcode: 0b1110011, funct3: 0b010}, sem: "rd = csr; csr |= rs1"}, refs: {latency_class: timing.scalar_alu}}
- {id: op.csrrc,  kind: op, status: reference, attrs: {family: csr, exu: SCALAR, encoding: {format: CSR, opcode: 0b1110011, funct3: 0b011}, sem: "rd = csr; csr &= ~rs1"}, refs: {latency_class: timing.scalar_alu}}
- {id: op.csrrwi, kind: op, status: reference, attrs: {family: csr, exu: SCALAR, encoding: {format: CSR, opcode: 0b1110011, funct3: 0b101}, sem: "rd = csr; csr = uimm5"}, refs: {latency_class: timing.scalar_alu}}
- {id: op.csrrsi, kind: op, status: reference, attrs: {family: csr, exu: SCALAR, encoding: {format: CSR, opcode: 0b1110011, funct3: 0b110}, sem: "rd = csr; csr |= uimm5"}, refs: {latency_class: timing.scalar_alu}}
- {id: op.csrrci, kind: op, status: reference, attrs: {family: csr, exu: SCALAR, encoding: {format: CSR, opcode: 0b1110011, funct3: 0b100}, sem: "rd = csr; csr &= ~uimm5"}, refs: {latency_class: timing.scalar_alu}}
- {id: op.fence,  kind: op, status: normative, attrs: {family: control, exu: SCALAR, encoding: {format: I, opcode: 0b0001111, funct3: 0b000}, sem: "memory fence (no-op; ordering already program-order)"}, refs: {latency_class: timing.scalar_alu}}
- {id: op.ecall,  kind: op, status: normative, attrs: {family: control, exu: SCALAR, encoding: {format: I, opcode: 0b1110011, funct3: 0b000, imm: 0}, sem: "halted = true"}, refs: {latency_class: timing.scalar_alu}}
- {id: op.ebreak, kind: op, status: normative, attrs: {family: control, exu: SCALAR, encoding: {format: I, opcode: 0b1110011, funct3: 0b000, imm: 1}, sem: "halted = true"}, refs: {latency_class: timing.scalar_alu}}
- {id: op.delay,  kind: op, status: normative, attrs: {family: control, exu: SCALAR, encoding: {format: I, opcode: 0b1100111, funct3: 0b001}, sem: "hold issue for imm cycles (spacing primitive)"}, refs: {latency_class: timing.scalar_alu}}
- {id: op.seli,   kind: op, status: normative, attrs: {family: scale_io, exu: SCALAR, encoding: {format: I, opcode: 0b0000011, funct3: 0b111}, sem: "e[rd] = sext(imm12) (low 8 bits)"}, refs: {latency_class: timing.scalar_alu},
   operands: [{name: ed, type: type.scale, location: state.erf, direction: def}], effect: [{def: ed, expr: {op: imm_to_scale, args: [{lit: imm12}]}}]}

# ============================ LSU (operands + effect) =======================
- {id: op.lb,  kind: op, status: normative, attrs: {family: lsu_scalar_load, exu: LSU, blocking: true, encoding: {format: I, opcode: 0b0000011, funct3: 0b000}, align: 1}, refs: {latency_class: timing.lsu_scalar_load},
   operands: [{name: rd, type: type.scalar, location: state.xrf, direction: def}, {name: rs1, type: type.scalar, location: state.xrf, direction: use}, {name: imm, type: type.imm12, direction: use}, {name: mem, location: state.vmem, direction: use}], effect: [{def: rd, expr: {op: sext8, args: [{op: load, args: [mem, rs1, imm]}]}}]}
- {id: op.lh,  kind: op, status: normative, attrs: {family: lsu_scalar_load, exu: LSU, blocking: true, encoding: {format: I, opcode: 0b0000011, funct3: 0b001}, align: 2}, refs: {latency_class: timing.lsu_scalar_load},
   operands: [{name: rd, type: type.scalar, location: state.xrf, direction: def}, {name: rs1, type: type.scalar, location: state.xrf, direction: use}, {name: imm, type: type.imm12, direction: use}, {name: mem, location: state.vmem, direction: use}], effect: [{def: rd, expr: {op: sext16, args: [{op: load, args: [mem, rs1, imm]}]}}]}
- {id: op.lw,  kind: op, status: normative, attrs: {family: lsu_scalar_load, exu: LSU, blocking: true, encoding: {format: I, opcode: 0b0000011, funct3: 0b010}, align: 4}, refs: {latency_class: timing.lsu_scalar_load},
   operands: [{name: rd, type: type.scalar, location: state.xrf, direction: def}, {name: rs1, type: type.scalar, location: state.xrf, direction: use}, {name: imm, type: type.imm12, direction: use}, {name: mem, location: state.vmem, direction: use}], effect: [{def: rd, expr: {op: load, args: [mem, rs1, imm]}}]}
- {id: op.lbu, kind: op, status: normative, attrs: {family: lsu_scalar_load, exu: LSU, blocking: true, encoding: {format: I, opcode: 0b0000011, funct3: 0b100}, align: 1}, refs: {latency_class: timing.lsu_scalar_load},
   operands: [{name: rd, type: type.scalar, location: state.xrf, direction: def}, {name: rs1, type: type.scalar, location: state.xrf, direction: use}, {name: imm, type: type.imm12, direction: use}, {name: mem, location: state.vmem, direction: use}], effect: [{def: rd, expr: {op: zext8, args: [{op: load, args: [mem, rs1, imm]}]}}]}
- {id: op.lhu, kind: op, status: normative, attrs: {family: lsu_scalar_load, exu: LSU, blocking: true, encoding: {format: I, opcode: 0b0000011, funct3: 0b101}, align: 2}, refs: {latency_class: timing.lsu_scalar_load},
   operands: [{name: rd, type: type.scalar, location: state.xrf, direction: def}, {name: rs1, type: type.scalar, location: state.xrf, direction: use}, {name: imm, type: type.imm12, direction: use}, {name: mem, location: state.vmem, direction: use}], effect: [{def: rd, expr: {op: zext16, args: [{op: load, args: [mem, rs1, imm]}]}}]}
- {id: op.sb, kind: op, status: normative, attrs: {family: lsu_scalar_store, exu: LSU, blocking: true, encoding: {format: S, opcode: 0b0100011, funct3: 0b000}, align: 1}, refs: {latency_class: timing.lsu_scalar_store},
   operands: [{name: mem, location: state.vmem, direction: def}, {name: rs2, type: type.scalar, location: state.xrf, direction: use}, {name: rs1, type: type.scalar, location: state.xrf, direction: use}, {name: imm, type: type.imm12, direction: use}], effect: [{def: mem, expr: {op: store, args: [rs1, imm, {op: trunc8, args: [rs2]}]}}]}
- {id: op.sh, kind: op, status: normative, attrs: {family: lsu_scalar_store, exu: LSU, blocking: true, encoding: {format: S, opcode: 0b0100011, funct3: 0b001}, align: 2}, refs: {latency_class: timing.lsu_scalar_store},
   operands: [{name: mem, location: state.vmem, direction: def}, {name: rs2, type: type.scalar, location: state.xrf, direction: use}, {name: rs1, type: type.scalar, location: state.xrf, direction: use}, {name: imm, type: type.imm12, direction: use}], effect: [{def: mem, expr: {op: store, args: [rs1, imm, {op: trunc16, args: [rs2]}]}}]}
- {id: op.sw, kind: op, status: normative, attrs: {family: lsu_scalar_store, exu: LSU, blocking: true, encoding: {format: S, opcode: 0b0100011, funct3: 0b010}, align: 4}, refs: {latency_class: timing.lsu_scalar_store},
   operands: [{name: mem, location: state.vmem, direction: def}, {name: rs2, type: type.scalar, location: state.xrf, direction: use}, {name: rs1, type: type.scalar, location: state.xrf, direction: use}, {name: imm, type: type.imm12, direction: use}], effect: [{def: mem, expr: {op: store, args: [rs1, imm, rs2]}}]}
- {id: op.seld, kind: op, status: normative, attrs: {family: scale_io, exu: LSU, blocking: true, encoding: {format: I, opcode: 0b0000011, funct3: 0b110}, align: 1}, refs: {latency_class: timing.lsu_scalar_load},
   operands: [{name: ed, type: type.scale, location: state.erf, direction: def}, {name: rs1, type: type.scalar, location: state.xrf, direction: use}, {name: imm, type: type.imm12, direction: use}, {name: mem, location: state.vmem, direction: use}], effect: [{def: ed, expr: {op: load, args: [mem, rs1, imm]}}]}
- {id: op.vload,  kind: op, status: normative, attrs: {family: tensor_ls, exu: LSU, blocking: true, encoding: {format: VLS, opcode: 0b0000111, funct2: 0b00}, align: 32, addr: "rs1 + (imm<<5)"}, refs: {latency_class: timing.lsu_vload_vstore},
   operands: [{name: vd, type: type.mrf_tile_fp8, location: state.mrf, direction: def}, {name: rs1, type: type.scalar, location: state.xrf, direction: use}, {name: imm, type: type.imm12, direction: use}, {name: mem, location: state.vmem, direction: use}], effect: [{def: vd, expr: {op: load_tile, args: [mem, rs1, imm]}}]}
- {id: op.vstore, kind: op, status: normative, attrs: {family: tensor_ls, exu: LSU, blocking: true, encoding: {format: VLS, opcode: 0b0000111, funct2: 0b01}, align: 32, addr: "rs1 + (imm<<5)"}, refs: {latency_class: timing.lsu_vload_vstore},
   operands: [{name: mem, location: state.vmem, direction: def}, {name: vd, type: type.mrf_tile_fp8, location: state.mrf, direction: use}, {name: rs1, type: type.scalar, location: state.xrf, direction: use}, {name: imm, type: type.imm12, direction: use}], effect: [{def: mem, expr: {op: store_tile, args: [rs1, imm, vd]}}]}

