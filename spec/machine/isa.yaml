   operands: [{name: vd, type: type.mrf_tile_bf16, location: state.mrf, direction: def}, {name: vs1, type: type.mrf_tile_bf16, location: state.mrf, direction: use}, {name: vs2, type: type.mrf_tile_bf16, location: state.mrf, direction: use}], effect: [{def: vd, expr: {op: sub, args: [vs1, vs2]}}]}
