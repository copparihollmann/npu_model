# provenance.yaml — `source` + `claim` nodes. claims ref `about` (the nodes they
# assert) and `sources`. status vocabulary applies bundle-wide.
spec_meta: {name: atlas_npu_subset, implements_model_name: SimpleNPU, version: 0.1.0, maturity: S2}
nodes:

# --- sources ----------------------------------------------------------------
- {id: source.npu_spec_md, kind: source, status: reference, attrs: {type: human_spec, trust: high, path: "npu_spec/00..06/README.md", role: primary_normative_human_spec}}
- {id: source.npu_model_exec, kind: source, status: reference, attrs: {type: executable_model, trust: high_for_semantics, path: "npu_model/", role: authoritative_semantics_and_latency}}
- {id: source.hw_config_default, kind: source, status: reference, attrs: {type: configuration, trust: high_for_sizes, path: "npu_model/configs/hardware/default.py", role: concrete_parameter_values}}
- {id: source.workloads, kind: source, status: reference, attrs: {type: workload_programs, trust: high, path: "npu_model/configs/programs/*", role: application_contract}}
- {id: source.tests, kind: source, status: reference, attrs: {type: verification, trust: high, path: "tests/*", role: obligations_and_oracles}}
- {id: source.sol_model, kind: source, status: reference, attrs: {type: performance_model, trust: medium, path: "npu_speed_of_light/", role: roofline}}

# --- claims (the ledger) ----------------------------------------------------
- {id: claim.mxu0.topology, kind: claim, status: reference, refs: {about: [unit.mxu0, unit.mxu1], sources: [source.npu_spec_md, source.npu_model_exec]}, attrs: {confidence: high, text: "MXU0 systolic, MXU1 inner-product; differ by latency class + EXU; internal fabric is an implementation choice"}}
- {id: claim.scalar.register_width, kind: claim, status: open, refs: {about: [state.xrf], sources: [source.npu_spec_md, source.npu_model_exec]}, attrs: {confidence: medium, text: "XRF width: npu_spec says 32-bit; model mixes RV64 (6-bit shamt, 64-bit compares). Recommend RV32 + 32-bit masking."}}
- {id: claim.memory_map.bases, kind: claim, status: reference, refs: {about: [state.imem, state.vmem, state.dram], sources: [source.npu_spec_md, source.npu_model_exec]}, attrs: {confidence: high, text: "high system-map bases are an npu_spec convention; the model addresses each region from 0 (normative)"}}
- {id: claim.pc.units, kind: claim, status: open, refs: {about: [state.pc], sources: [source.npu_spec_md, source.npu_model_exec]}, attrs: {confidence: high, text: "PC: npu_spec = instruction-word index (+1, normative); model = byte address (+4). Reconcile branch-offset units."}}
- {id: claim.isa.binary_encoding, kind: claim, status: open, refs: {about: [op.vmatmul.mxu0], sources: [source.npu_model_exec]}, attrs: {confidence: high, text: "model is mnemonic-driven; to_bytecode packers buggy (VR vs2 shift, IType rd/imm). Field VALUES authoritative; define a clean bit layout."}}
- {id: claim.vmem.bus_width_bits, kind: claim, status: open, refs: {about: [channel.vmem_bus, param.vmem_bus_width_bits], sources: [source.npu_spec_md, source.hw_config_default]}, attrs: {confidence: medium, text: "VMEM bus 256-bit (npu_spec, normative) vs 512-bit (default.py). Pick one."}}
- {id: claim.dram.capacity, kind: claim, status: assumption, refs: {about: [state.dram], sources: [source.npu_spec_md, source.hw_config_default]}, attrs: {confidence: medium, text: "DRAM 16 GiB (npu_spec) vs 1 GiB (DefaultHardwareConfig)."}}
- {id: claim.vmem.bank_conflict_policy, kind: claim, status: normative, refs: {about: [state.vmem], sources: [source.npu_model_exec]}, attrs: {confidence: high, text: "bank conflicts are software-managed, statically illegal; model raises BankConflictError. RTL must detect/flag; silent corruption prohibited."}}
- {id: claim.vmem.conflict_granularity, kind: claim, status: normative, refs: {about: [state.vmem], sources: [source.npu_model_exec]}, attrs: {confidence: high, text: "conflict unit is the 32-byte line (no modulo-bank folding); 8 banks is the physical organization."}}
- {id: claim.mxu.buffer_banking, kind: claim, status: normative, refs: {about: [state.mxu_weight_slots, state.mxu_accum_buffers], sources: [source.npu_model_exec]}, attrs: {confidence: high, text: "weight buffer + accumulator each form one conflict-bank per MXU (both slots share)."}}
- {id: claim.sync_flags.semantics, kind: claim, status: normative, refs: {about: [state.sync_flags, op.dma.wait], sources: [source.npu_spec_md, source.npu_model_exec]}, attrs: {confidence: medium, text: "8 per-channel flags; busy issue->completion; dma.wait.chN fences decode until channel idle."}}
- {id: claim.mxu.accumulation_precision, kind: claim, status: normative, refs: {about: [op.vmatmul.mxu0, op.vmatmul.acc.mxu0], sources: [source.npu_model_exec]}, attrs: {confidence: high, text: "MXU multiplies FP8xFP8; internal precision >= fp16; accumulator rounded to BF16 each matmul."}}
- {id: claim.vli.immediate_encoding, kind: claim, status: normative, refs: {about: [op.vli.all], sources: [source.npu_model_exec]}, attrs: {confidence: high, text: "vli.* imm16 is a raw BF16 bit-pattern, not an integer."}}
- {id: claim.xlu.binding, kind: claim, status: reference, refs: {about: [unit.xlu, op.vtrpose.xlu], sources: [source.npu_spec_md, source.npu_model_exec]}, attrs: {confidence: high, text: "XLU may be a distinct datapath or a VPU mode (model dispatches vtrpose via the vector EXU)."}}
- {id: claim.branch.delay_slots, kind: claim, status: normative, refs: {about: [op.beq, op.jal], sources: [source.npu_spec_md, source.npu_model_exec]}, attrs: {confidence: high, text: "2 architecturally-visible delay slots; branch/jump in a delay slot illegal; offsets are plain displacements (the -PIPELINE_LATENCY*4 is a model artifact)."}}
- {id: claim.init.reset_values, kind: claim, status: assumption, refs: {about: [state.xrf], sources: [source.npu_model_exec]}, attrs: {confidence: high, text: "reset values unspecified except x0; randomization (seed 42) is a verification aid, not architecture."}}
- {id: claim.scheduling.occupancy_contract, kind: claim, status: normative, refs: {about: [param.dependency_model], sources: [source.npu_model_exec]}, attrs: {confidence: high, text: "each non-DMA unit holds its issue port for its full latency; over-issue is a backpressure error, not a stall; delay + dma.wait are the only blocking primitives."}}
- {id: claim.dma.encoding, kind: claim, status: reference, refs: {about: [op.dma.config, op.dma.wait], sources: [source.npu_spec_md, source.npu_model_exec]}, attrs: {confidence: high, text: "MODEL DEFECT: dma.config and dma.wait both funct7=0x01; npu_spec gives distinct funct7 (0x00/0x01). npu_spec normative; fix the model. config uses rs1 (only rd reserved-zero)."}}
- {id: claim.erf.scale_type, kind: claim, status: open, refs: {about: [state.erf], sources: [source.npu_spec_md, source.npu_model_exec]}, attrs: {confidence: medium, text: "ERF scale: npu_spec=E8M0 power-of-2 (2^e); model multiplies by raw integer. Decide; affects all quantization numerics."}}
- {id: claim.soc.offchip_interface, kind: claim, status: reference, refs: {about: [channel.offchip_link], sources: [source.npu_spec_md]}, attrs: {confidence: medium, text: "off-chip is a serial TileLink interface with PERIPH/DRAM regions (npu_spec/06 §4); concrete binding = SoC artifact."}}
- {id: claim.abi.rv32i, kind: claim, status: reference, refs: {about: [state.xrf], sources: [source.npu_spec_md]}, attrs: {confidence: high, text: "full RV32I ABI defined (npu_spec/06); tensor/scale/MXU state is caller-saved."}}
- {id: claim.host.transport, kind: claim, status: open, refs: {about: [channel.host_control], sources: [source.npu_spec_md, source.npu_model_exec]}, attrs: {confidence: high, text: "no MMIO control block / architected STATUS/ERROR/START CSRs; host transport implementation-defined."}}
- {id: claim.error.model_behavior, kind: claim, status: reference, refs: {about: [state.halted], sources: [source.npu_model_exec]}, attrs: {confidence: high, text: "model raises exceptions and aborts on fatal classes; only ecall/ebreak set halted. Required HW: deterministic stop + host-observable status."}}
- {id: claim.crosscutting.deferred, kind: claim, status: open, refs: {about: [axis.ras, axis.security_isolation, axis.power_clock_thermal], sources: [source.npu_spec_md, source.npu_model_exec]}, attrs: {confidence: high, text: "interconnect/RAS/security/power/QoS/capability undefined in v0; surfaced explicitly (cross_cutting.yaml)."}}
