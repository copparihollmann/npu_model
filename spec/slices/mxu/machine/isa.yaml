# isa.yaml (MXU slice) — the 14 MXU `op` nodes.
#
# Reconciled against npu_spec/06_instruction_set (the "Instruction Green Card") AND
# npu_model. funct7 matches the green card hex (77/00 .. 77/13). Each op carries:
#   - attrs.sem      : the authoritative npu_spec Verilog-style semantic (selector-exact)
#   - attrs.encoding : VR format, opcode 0b1110111, funct7, + reserved_zero/selector rules
#   - operands+effect: the structured SSA def-use (lowers mechanically; --ssa mxu_matmul)
#
# SELECTOR ENCODING (npu_spec §06, decode reserved-zero rules §04):
#   weight slot chosen by vd (vmatpush.weight) or vs2[0] (vmatmul); 2 slots/MXU.
#   accumulator chosen by vd[0] (push/matmul) or vs2[0] (pop);     2 accs/MXU.
#   BF16 tile names the LOW register of {m[r], m[r+1]}; r=63 illegal (see constraints).
nodes:

# ---- weight push: MRF tile -> weight slot (weight-stationary load) ---------
- {id: op.vmatpush.weight.mxu0, kind: op, status: normative, attrs: {family: mxu_weight_push, exu: MATRIX_SYSTOLIC, blocking: true, sem: "mxu0.w[vd] = m[vs1]", encoding: {format: VR, opcode: 0b1110111, funct7: 0b0000000, hex: "77/00", reserved_zero: "vs2=0, vd[5:1]=0", selector: "weight slot = vd[0]"}}, refs: {latency_class: timing.mxu_push_pop, unit: unit.mxu0},
   operands: [{name: wd, type: type.weight_tile_fp8, location: state.mxu_weight_slots, direction: def}, {name: vs1, type: type.mrf_tile_fp8, location: state.mrf, direction: use}], effect: [{def: wd, expr: {op: push, args: [vs1]}}]}
- {id: op.vmatpush.weight.mxu1, kind: op, status: normative, attrs: {family: mxu_weight_push, exu: MATRIX_INNER, blocking: true, sem: "mxu1.w[vd] = m[vs1]", encoding: {format: VR, opcode: 0b1110111, funct7: 0b0000001, hex: "77/01", reserved_zero: "vs2=0, vd[5:1]=0", selector: "weight slot = vd[0]"}}, refs: {latency_class: timing.mxu_push_pop, unit: unit.mxu1},
   operands: [{name: wd, type: type.weight_tile_fp8, location: state.mxu_weight_slots, direction: def}, {name: vs1, type: type.mrf_tile_fp8, location: state.mrf, direction: use}], effect: [{def: wd, expr: {op: push, args: [vs1]}}]}

# ---- accumulator seed/push: MRF tile -> accumulator -----------------------
- {id: op.vmatpush.acc.fp8.mxu0, kind: op, status: normative, attrs: {family: mxu_acc_push, exu: MATRIX_SYSTOLIC, blocking: true, sem: "mxu0.acc[vd[0]] = dequantize(m[vs1])", encoding: {format: VR, opcode: 0b1110111, funct7: 0b0000010, hex: "77/02", reserved_zero: "vs2=0, vd[5:1]=0", selector: "acc = vd[0]"}}, refs: {latency_class: timing.mxu_push_pop, unit: unit.mxu0},
   operands: [{name: ad, type: type.acc_tile_bf16, location: state.mxu_accum_buffers, direction: def}, {name: vs1, type: type.mrf_tile_fp8, location: state.mrf, direction: use}], effect: [{def: ad, expr: {op: dequantize_bf16, args: [vs1]}}]}
- {id: op.vmatpush.acc.fp8.mxu1, kind: op, status: normative, attrs: {family: mxu_acc_push, exu: MATRIX_INNER, blocking: true, sem: "mxu1.acc[vd[0]] = dequantize(m[vs1])", encoding: {format: VR, opcode: 0b1110111, funct7: 0b0000011, hex: "77/03", reserved_zero: "vs2=0, vd[5:1]=0", selector: "acc = vd[0]"}}, refs: {latency_class: timing.mxu_push_pop, unit: unit.mxu1},
   operands: [{name: ad, type: type.acc_tile_bf16, location: state.mxu_accum_buffers, direction: def}, {name: vs1, type: type.mrf_tile_fp8, location: state.mrf, direction: use}], effect: [{def: ad, expr: {op: dequantize_bf16, args: [vs1]}}]}
- {id: op.vmatpush.acc.bf16.mxu0, kind: op, status: normative, attrs: {family: mxu_acc_push, exu: MATRIX_SYSTOLIC, blocking: true, sem: "mxu0.acc[vd[0]] = {m[vs1], m[vs1+1]}", encoding: {format: VR, opcode: 0b1110111, funct7: 0b0000100, hex: "77/04", reserved_zero: "vs2=0, vd[5:1]=0", selector: "acc = vd[0]; vs1 is bf16 pair low reg"}}, refs: {latency_class: timing.mxu_push_pop, unit: unit.mxu0},
   operands: [{name: ad, type: type.acc_tile_bf16, location: state.mxu_accum_buffers, direction: def}, {name: vs1, type: type.mrf_tile_bf16, location: state.mrf, direction: use}], effect: [{def: ad, expr: {op: copy, args: [vs1]}}]}
- {id: op.vmatpush.acc.bf16.mxu1, kind: op, status: normative, attrs: {family: mxu_acc_push, exu: MATRIX_INNER, blocking: true, sem: "mxu1.acc[vd[0]] = {m[vs1], m[vs1+1]}", encoding: {format: VR, opcode: 0b1110111, funct7: 0b0000101, hex: "77/05", reserved_zero: "vs2=0, vd[5:1]=0", selector: "acc = vd[0]; vs1 is bf16 pair low reg"}}, refs: {latency_class: timing.mxu_push_pop, unit: unit.mxu1},
   operands: [{name: ad, type: type.acc_tile_bf16, location: state.mxu_accum_buffers, direction: def}, {name: vs1, type: type.mrf_tile_bf16, location: state.mrf, direction: use}], effect: [{def: ad, expr: {op: copy, args: [vs1]}}]}

# ---- accumulator pop: accumulator -> MRF tile (drain, optional requant) ----
- {id: op.vmatpop.fp8.acc.mxu0, kind: op, status: normative, attrs: {family: mxu_acc_pop, exu: MATRIX_SYSTOLIC, blocking: true, sem: "m[vd] = quantize_fp8(mxu0.acc[vs2[0]], e[es1])", encoding: {format: VR, opcode: 0b1110111, funct7: 0b0000110, hex: "77/06", reserved_zero: "vs1=0, vs2[5:1]=0", selector: "acc = vs2[0]; scale = es1"}}, refs: {latency_class: timing.mxu_push_pop, unit: unit.mxu0},
   operands: [{name: vd, type: type.mrf_tile_fp8, location: state.mrf, direction: def}, {name: vs2, type: type.acc_tile_bf16, location: state.mxu_accum_buffers, direction: use}, {name: es1, type: type.scale, location: state.erf, direction: use}], effect: [{def: vd, expr: {op: quantize_fp8_trunc, args: [vs2, es1]}}]}
- {id: op.vmatpop.fp8.acc.mxu1, kind: op, status: normative, attrs: {family: mxu_acc_pop, exu: MATRIX_INNER, blocking: true, sem: "m[vd] = quantize_fp8(mxu1.acc[vs2[0]], e[es1])", encoding: {format: VR, opcode: 0b1110111, funct7: 0b0000111, hex: "77/07", reserved_zero: "vs1=0, vs2[5:1]=0", selector: "acc = vs2[0]; scale = es1"}}, refs: {latency_class: timing.mxu_push_pop, unit: unit.mxu1},
   operands: [{name: vd, type: type.mrf_tile_fp8, location: state.mrf, direction: def}, {name: vs2, type: type.acc_tile_bf16, location: state.mxu_accum_buffers, direction: use}, {name: es1, type: type.scale, location: state.erf, direction: use}], effect: [{def: vd, expr: {op: quantize_fp8_trunc, args: [vs2, es1]}}]}
- {id: op.vmatpop.bf16.acc.mxu0, kind: op, status: normative, attrs: {family: mxu_acc_pop, exu: MATRIX_SYSTOLIC, blocking: true, sem: "{m[vd], m[vd+1]} = mxu0.acc[vs2[0]]", encoding: {format: VR, opcode: 0b1110111, funct7: 0b0001000, hex: "77/08", reserved_zero: "vs1=0, vs2[5:1]=0", selector: "acc = vs2[0]; vd is bf16 pair low reg"}}, refs: {latency_class: timing.mxu_push_pop, unit: unit.mxu0},
   operands: [{name: vd, type: type.mrf_tile_bf16, location: state.mrf, direction: def}, {name: vs2, type: type.acc_tile_bf16, location: state.mxu_accum_buffers, direction: use}], effect: [{def: vd, expr: {op: copy, args: [vs2]}}]}
- {id: op.vmatpop.bf16.acc.mxu1, kind: op, status: normative, attrs: {family: mxu_acc_pop, exu: MATRIX_INNER, blocking: true, sem: "{m[vd], m[vd+1]} = mxu1.acc[vs2[0]]", encoding: {format: VR, opcode: 0b1110111, funct7: 0b0001001, hex: "77/09", reserved_zero: "vs1=0, vs2[5:1]=0", selector: "acc = vs2[0]; vd is bf16 pair low reg"}}, refs: {latency_class: timing.mxu_push_pop, unit: unit.mxu1},
   operands: [{name: vd, type: type.mrf_tile_bf16, location: state.mrf, direction: def}, {name: vs2, type: type.acc_tile_bf16, location: state.mxu_accum_buffers, direction: use}], effect: [{def: vd, expr: {op: copy, args: [vs2]}}]}

# ---- matmul: activation (MRF) x weight (slot) -> accumulator ---------------
- {id: op.vmatmul.mxu0, kind: op, status: normative, attrs: {family: mxu_matmul, exu: MATRIX_SYSTOLIC, sem: "mxu0.acc[vd[0]] = m[vs1] @ mxu0.w[vs2[0]]", encoding: {format: VR, opcode: 0b1110111, funct7: 0b0001010, hex: "77/10", reserved_zero: "vd[5:1]=0, vs2[5:1]=0", selector: "acc = vd[0]; weight slot = vs2[0]"}}, refs: {latency_class: timing.mxu0_matmul, unit: unit.mxu0},
   operands: [{name: vd, type: type.acc_tile_bf16, location: state.mxu_accum_buffers, direction: def}, {name: vs1, type: type.mrf_tile_fp8, location: state.mrf, direction: use}, {name: vs2, type: type.weight_tile_fp8, location: state.mxu_weight_slots, direction: use}], effect: [{def: vd, expr: {op: matmul, args: [vs1, vs2]}}]}
- {id: op.vmatmul.mxu1, kind: op, status: normative, attrs: {family: mxu_matmul, exu: MATRIX_INNER, sem: "mxu1.acc[vd[0]] = m[vs1] @ mxu1.w[vs2[0]]", encoding: {format: VR, opcode: 0b1110111, funct7: 0b0001011, hex: "77/11", reserved_zero: "vd[5:1]=0, vs2[5:1]=0", selector: "acc = vd[0]; weight slot = vs2[0]"}}, refs: {latency_class: timing.mxu1_matmul, unit: unit.mxu1},
   operands: [{name: vd, type: type.acc_tile_bf16, location: state.mxu_accum_buffers, direction: def}, {name: vs1, type: type.mrf_tile_fp8, location: state.mrf, direction: use}, {name: vs2, type: type.weight_tile_fp8, location: state.mxu_weight_slots, direction: use}], effect: [{def: vd, expr: {op: matmul, args: [vs1, vs2]}}]}
- {id: op.vmatmul.acc.mxu0, kind: op, status: normative, attrs: {family: mxu_matmul, exu: MATRIX_SYSTOLIC, sem: "mxu0.acc[vd[0]] = mxu0.acc[vd[0]] + m[vs1] @ mxu0.w[vs2[0]]", encoding: {format: VR, opcode: 0b1110111, funct7: 0b0001100, hex: "77/12", reserved_zero: "vd[5:1]=0, vs2[5:1]=0", selector: "acc = vd[0]; weight slot = vs2[0]"}}, refs: {latency_class: timing.mxu0_matmul, unit: unit.mxu0},
   operands: [{name: vd, type: type.acc_tile_bf16, location: state.mxu_accum_buffers, direction: inout}, {name: vs1, type: type.mrf_tile_fp8, location: state.mrf, direction: use}, {name: vs2, type: type.weight_tile_fp8, location: state.mxu_weight_slots, direction: use}], effect: [{def: vd, expr: {op: add, args: [vd, {op: matmul, args: [vs1, vs2]}]}}]}
- {id: op.vmatmul.acc.mxu1, kind: op, status: normative, attrs: {family: mxu_matmul, exu: MATRIX_INNER, sem: "mxu1.acc[vd[0]] = mxu1.acc[vd[0]] + m[vs1] @ mxu1.w[vs2[0]]", encoding: {format: VR, opcode: 0b1110111, funct7: 0b0001101, hex: "77/13", reserved_zero: "vd[5:1]=0, vs2[5:1]=0", selector: "acc = vd[0]; weight slot = vs2[0]"}}, refs: {latency_class: timing.mxu1_matmul, unit: unit.mxu1},
   operands: [{name: vd, type: type.acc_tile_bf16, location: state.mxu_accum_buffers, direction: inout}, {name: vs1, type: type.mrf_tile_fp8, location: state.mrf, direction: use}, {name: vs2, type: type.weight_tile_fp8, location: state.mxu_weight_slots, direction: use}], effect: [{def: vd, expr: {op: add, args: [vd, {op: matmul, args: [vs1, vs2]}]}}]}
